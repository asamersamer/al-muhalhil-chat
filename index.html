<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المهلهل - بسرعتك انت</title>
<style>
body{font-family:system-ui;background:#0f172a;color:#fff;margin:0;padding:10px}
.header{text-align:center}
.logo{width:90px;height:90px;border-radius:50%;background:linear-gradient(45deg,#fbbf24,#dc2626);display:flex;align-items:center;justify-content:center;font-size:55px;margin:5px auto;border:3px solid #fff}
h1{color:#fbbf24;margin:5px 0}
.dialect{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.dialect button{background:#334155;color:#fff;border:1px solid #fbbf24;border-radius:20px;padding:7px 11px}
.dialect button.active{background:#fbbf24;color:#000;font-weight:bold}
#chat{height:46vh;overflow:auto;background:#1e293b;border-radius:15px;padding:12px;margin-bottom:10px}
.msg{padding:11px;border-radius:12px;margin:8px 0;max-width:90%;line-height:1.8}
.user{background:#2563eb;margin-right:auto}
.bot{background:#334155}
.speakBtn{background:#fbbf24;border:none;border-radius:20px;padding:6px 12px;margin-top:6px;font-weight:bold}
input{width:56%;padding:13px;border-radius:20px;border:none;color:#000}
button.send{width:18%;padding:13px;border-radius:20px;border:none;background:#fbbf24;font-weight:bold}
button.mic{width:18%;padding:13px;border-radius:20px;border:none;background:#dc2626;color:#fff;font-size:18px}
.speedBox{background:#1e293b;padding:10px;border-radius:12px;text-align:center;margin:8px 0}
.speedBox input{width:80%}
</style>
</head>
<body>
<div class="header"><div class="logo">⚔️</div><h1>المهلهل</h1><p>يتكلم بسرعتك انت، هادي وعلى مهل</p></div>

<div class="speedBox">
<b>سرعة الكلام - مثل صوتك:</b><br>
<input type="range" id="speedSlider" min="0.5" max="1.0" step="0.05" value="0.78">
<p id="speedLabel" style="color:#fbbf24;margin:2px">السرعة: 0.78 - نفس سرعة صوتك، هادي</p>
</div>

<p id="currentDialect" style="text-align:center;color:#fbbf24">اللهجة: تلقائي</p>
<div class="dialect">
<button onclick="setDialect('auto',this)" class="active">تلقائي</button>
<button onclick="setDialect('sanaani',this)">صنعاني</button>
<button onclick="setDialect('taizi',this)">تعزي</button>
<button onclick="setDialect('adeni',this)">عدني</button>
<button onclick="setDialect('english',this)">English</button>
</div>
<div id="chat"><div class="msg bot">ارحب يا غالي، اش تشتي اليوم؟ هلا والله.<br><button class="speakBtn" id="firstSpeak">اسمع صوتي - هذا صوتك انت</button></div></div>
<div style="display:flex;gap:5px">
<input id="inp" placeholder="تكلم بلهجتك هنا...">
<button class="mic" id="micBtn">🎤</button>
<button class="send" id="sendBtn">أرسل</button>
</div>
<p id="status" style="text-align:center;color:#fbbf24"></p>
<audio id="player" style="display:none"></audio>
<script>
let history=[]; let manualDialect='auto'; let currentDialect='sanaani';
let mySpeed=0.78; // سرعتك انت

document.getElementById('speedSlider').addEventListener('input', function(){
  mySpeed=parseFloat(this.value);
  document.getElementById('speedLabel').innerText='السرعة: '+mySpeed+' - '+(mySpeed<0.7?'بطيء جدا، هادي':mySpeed<0.85?'نفس سرعتك، هادي':'سريع');
});

function detectDialect(text){
  if(manualDialect!=='auto') return manualDialect;
  if(/[a-zA-Z]{3,}/.test(text)) return 'english';
  if(/كيفك|اشتي|موش|وينك|هيا|قلبي/.test(text)) return 'taizi';
  if(/فين|كود|بغيت|هب|ياخي|مفتهن/.test(text)) return 'adeni';
  return 'sanaani';
}
function getDialectPrompt(d){
  if(d==='taizi') return `انت المهلهل التعزي، تتكلم تعزي فقط. استخدم: كيفك، اشتي، اش تشتي، موش، وينك، هيا، قلبي. اكتب بدون تشكيل، كلام عادي. ضع فاصلة بعد كل كلمتين عشان يتكلم على مهل. ممنوع تقول ايش، قول اش. جمل قصيرة.`;
  if(d==='adeni') return `انت المهلهل العدني، تتكلم عدني فقط. كلماتك: فين، اشتي، اش تشتي، كود، بغيت، هب، ياخي. اكتب بدون تشكيل. ضع فاصلة بعد كل كلمتين عشان يتكلم على مهل.`;
  if(d==='english') return `You are Al-Muhalhil, Yemeni man. Speak ONLY English, slow, calm, short sentences. Put a comma after every few words.`;
  return `انت المهلهل الصنعاني، تتكلم صنعاني فقط مثل صاحب الصوت. لازم تقول: ارحب يا غالي، اش تشتي اليوم، هلا والله. ممنوع تقول ايش، قول اش. كلماتك: هلا والله، ارحب، يا غالي، اش تشتي، ذلحين. اكتب بدون تشكيل، كلام عادي مثل الواتساب. ضع فاصلة بعد كل كلمتين عشان يتكلم على مهل مثل صاحب الصوت، مش سريع. ممنوع مصري. جمل قصيرة.`;
}
function setDialect(d,btn){
  manualDialect=d;
  document.querySelectorAll('.dialect button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  let names={auto:'تلقائي',sanaani:'صنعاني',taizi:'تعزي',adeni:'عدني',english:'English'};
  document.getElementById('currentDialect').innerText='اللهجة: '+names[d];
}

function speakText(text){
  // اذا ترحيب، شغل صوتك انت الحقيقي بسرعتك
  if(text.includes('ارحب') || text.includes('اش تشتي')){
    let p=document.getElementById('player');
    p.src='myvoice.mp3';
    p.playbackRate=mySpeed+0.22; // صوتك اصلا بطيء، نخليه طبيعي
    p.play();
    return;
  }
  window.speechSynthesis.cancel();
  // نضيف وقفات مثل صوتك: ارحب ، يا غالي ، اش تشتي
  let clean=text.replace(/[🧔⚔️📜📖💡📚🎤🔊✨🌟😊😂❤️👌🙏]/g,'').replace(/[ًٌٍَُِّْ]/g,'').trim();
  // نحول النقط لفاصلات عشان يوقف شوية بين الجمل مثل ما توقف انت
  clean = clean.replace(/\. /g,' ، ').replace(/\?/g,' ، ');
  let u=new SpeechSynthesisUtterance(clean);
  let voices=window.speechSynthesis.getVoices();
  if(currentDialect==='english'){ u.lang='en-US'; u.voice=voices.find(v=>v.lang.startsWith('en')); }
  else { u.lang='ar-SA'; u.voice=voices.find(v=>v.lang==='ar-SA')||voices.find(v=>v.lang.startsWith('ar')); }
  u.rate=mySpeed; // 0.78 = نفس سرعتك، هادي
  u.pitch=0.85; // صوت ثقيل مثل صوتك، مش حاد
  u.volume=1;
  window.speechSynthesis.speak(u);
}

document.getElementById('firstSpeak').addEventListener('click', ()=>speakText('ارحب يا غالي، اش تشتي اليوم؟ هلا والله.'));
document.getElementById('sendBtn').addEventListener('click', send);
document.getElementById('micBtn').addEventListener('click', startListening);
document.getElementById('inp').addEventListener('keypress', e=>{ if(e.key==='Enter') send(); });
function startListening(){
  let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ alert('افتح في كروم'); return; }
  let rec=new SR(); rec.lang='ar-SA';
  document.getElementById('status').innerText='اتكلم ذلحين...';
  rec.onresult=e=>{ document.getElementById('inp').value=e.results[0][0].transcript; document.getElementById('status').innerText=''; send(); };
  rec.start();
}
async function send(){
  let inp=document.getElementById('inp'); let txt=inp.value.trim(); if(!txt) return;
  currentDialect=detectDialect(txt);
  let names={sanaani:'صنعاني',taizi:'تعزي',adeni:'عدني',english:'English'};
  document.getElementById('currentDialect').innerText='كشفت لهجتك: '+names[currentDialect];
  let chat=document.getElementById('chat');
  chat.innerHTML+='<div class="msg user">'+txt+'</div>'; inp.value=''; history.push(txt);
  chat.innerHTML+='<div class="msg bot" id="loading">المهلهل يفكر...</div>'; chat.scrollTop=chat.scrollHeight;
  try{
    let prompt=getDialectPrompt(currentDialect)+` تتذكر: ${history.slice(-8).join(' | ')} سؤال المستخدم: ${txt}`;
    let res=await fetch('https://text.pollinations.ai/'+encodeURIComponent(prompt)+'?model=openai');
    let data=await res.text();
    let el=document.getElementById('loading'); if(el) el.remove();
    let id='msg'+Date.now();
    chat.innerHTML+='<div class="msg bot" id="'+id+'">'+data+'<br><button class="speakBtn">اسمع صوتي</button></div>';
    document.getElementById(id).querySelector('.speakBtn').addEventListener('click', ()=>speakText(data));
    speakText(data);
  }catch(e){ let el=document.getElementById('loading'); if(el) el.innerText='مشكلة بالنت'; }
  chat.scrollTop=chat.scrollHeight;
}
</script>
</body>
</html>
